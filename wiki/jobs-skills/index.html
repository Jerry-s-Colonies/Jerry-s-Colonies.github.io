<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobs &amp; Skill Trees Wiki — The Frontier</title>
  <link rel="icon" href="../assets/img/jobs_skills_icon.png" type="image/png" />
  <link rel="stylesheet" href="../assets/css/oreui-wiki.css?v=20261126font" />
</head>

<body class="theme-jobs">
  <header class="topbar">
    <div class="topbar-left">
      <button class="oreui-btn oreui-btn-sm mobile-menu-btn" id="btnMobileMenu" type="button">Menu</button>
      <a class="brand-link" href="../index.html">
        <img class="brand-icon" src="../assets/img/jobs_skills_icon.png" alt="Jobs &amp; Skill Trees" />
        <div>
          <div class="brand-title">JOBS &amp; SKILL TREES</div>
          <span class="brand-sub" data-en="The Frontier Wiki • v1.0.2" data-fr="Wiki The Frontier • v1.0.2">The Frontier
            Wiki • v1.0.2</span>
        </div>
      </a>
    </div>

    <div class="topbar-search">
      <input id="globalSearch" type="search" autocomplete="off"
        data-ph-en="Search professions, 156 skills, forge stats, leather tanning, war seals..."
        data-ph-fr="Rechercher metiers, 156 competences, forge, tannage, sceaux..."
        placeholder="Search professions, 156 skills, forge stats, leather tanning, war seals..." />
      <span class="search-kbd">Ctrl+K</span>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>

    <div class="topbar-actions">
      <a class="oreui-btn oreui-btn-sm oreui-btn-crimson" href="../../index.html" data-en="Home" data-fr="Accueil">Home</a>
      <a class="oreui-btn oreui-btn-sm" href="../index.html" data-en="Hub" data-fr="Hub">Hub</a>
      <button class="oreui-btn oreui-btn-sm" id="btnLangToggle" type="button">EN / FR [EN]</button>
      <button class="oreui-btn oreui-btn-sm oreui-btn-info" id="btnThemeToggle" type="button">Light</button>
    </div>
  </header>

  <div class="wiki-shell">
    <aside class="sidebar" id="wikiSidebar"></aside>
    <main class="wiki-main">
      <div class="wiki-content-inner" id="wikiMain"></div>
    </main>
  </div>

  <!-- 3D Render + Recipe Lightbox Modal -->
  <div class="modal-backdrop" id="wikiModal">
    <div class="oreui-panel modal-dialog">
      <button class="oreui-btn oreui-btn-sm oreui-btn-crimson modal-close" id="btnCloseModal" type="button">X</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="../assets/js/vanilla-icons.js?v=20261124ek"></script>
  <script src="../assets/js/wiki-core.js?v=20261126nat"></script>
  <script src="data/jobs-data.js"></script>
  <script src="data/guide-core-blacksmith.js"></script>
  <script src="data/guide-all-professions.js"></script>

  <script>
    (function () {
      const W = window.FrontierWiki;
      const JS = window.JS_DATA || { jobs: [], items: [], entities: [], byId: {}, forgeStats: { thresholds: [], pools: {}, defs: {} } };
      const MODULES = window.JS_GUIDE_MODULES || [];

      const NAV_GROUPS = [
        { id: "core-system", label: { en: "Core System", fr: "Systeme General" } },
        { id: "professions", label: { en: "Professions (8 Roles)", fr: "Metiers (8 Roles)" } },
      ];

      const ENCYCLOPEDIAS = [
        { id: "enc-trees", label: { en: "Interactive 13x9 Skill Trees", fr: "Arbres 13x9 Interactifs" }, count: JS.totalSkills || 156 },
        { id: "enc-items", label: { en: "Items, Recipes & 3D Bar", fr: "Objets, Recettes & Barre 3D" }, count: (JS.items?.length || 0) + (JS.entities?.length || 0) },
        { id: "enc-consumables", label: { en: "Artisan Buffs Lab", fr: "Labo Buffs Artisanaux" }, count: 5 },
      ];

      const PAGE_ORDER = [...MODULES.map((m) => m.id), ...ENCYCLOPEDIAS.map((e) => e.id)];
      let currentPageId = (location.hash || "").replace(/^#/, "");
      if (!PAGE_ORDER.includes(currentPageId)) currentPageId = PAGE_ORDER[0] || "jobs-overview";

      const jobById = Object.fromEntries((JS.jobs || []).map((j) => [j.id, j]));

      const state = {
        activeTreeJob: "blacksmith",
        selectedSkillId: null,
        treeSearch: "",
        simCat: "weapon",
        simHeat: 96,
        simStrike: 95,
        simMasterSeal: true,
        consJob: "farmer",
        consCategory: "v",
        consRating: 5,
      };

      const WORKSTATION_NAMES = {
        "minecraft:furnace": { en: "Furnace", fr: "Fourneau" },
        "minecraft:blast_furnace": { en: "Blast Furnace", fr: "Haut Fourneau" },
        "minecraft:anvil": { en: "Anvil", fr: "Enclume" },
        "minecraft:cauldron": { en: "Water Cauldron", fr: "Chaudron d'Eau" },
        "minecraft:smoker": { en: "Smoker", fr: "Fumoir" },
        "minecraft:grindstone": { en: "Grindstone", fr: "Meule" },
        "minecraft:hay_block": { en: "Hay Block", fr: "Bloc de Foin" },
        "minecraft:beehive": { en: "Beehive", fr: "Ruche" },
        "minecraft:composter": { en: "Composter", fr: "Composteur" },
        "minecraft:barrel": { en: "Barrel", fr: "Tonneau" },
        "minecraft:fletching_table": { en: "Fletching Table", fr: "Table d'Archerie" },
      };

      const STAT_LABELS = {
        might: { en: "Melee Damage Might", fr: "Puissance Melee" },
        durability: { en: "Durability Save", fr: "Economie Durabilite" },
        weapon_agility: { en: "Quick Blade (Speed)", fr: "Lame Agile (Vitesse)" },
        strength: { en: "Battle Fury (Strength)", fr: "Fureur Combat (Force)" },
        lifesteal: { en: "Vampiric Lifesteal", fr: "Vol de Vie" },
        efficiency: { en: "Efficiency (Haste)", fr: "Efficacite (Hate)" },
        defense: { en: "Heavy Armor Defense", fr: "Blindage Armure Lourde" },
        resilience: { en: "Armor Resilience", fr: "Resilience Armure" },
        vitality: { en: "Health Vitality", fr: "Vitalite (Coeurs+)" },
        resistance: { en: "Resistance Shield", fr: "Bouclier Resistance" },
        fireproof: { en: "Fireproof Ward", fr: "Protection Feu/Lave" },
        agility: { en: "Agile Speed", fr: "Agilite (Vitesse)" },
        feather: { en: "Feather Fall Reduction", fr: "Chute Amortie" },
        defense_agile: { en: "Agile Mitigation", fr: "Mitigation Agile" },
        leap: { en: "Acrobatic Leap (Jump)", fr: "Bond Acrobatique (Saut)" },
        tool_agility: { en: "Tool Haste / Speed", fr: "Celerite Outil" },
        night_eye: { en: "Underground Night Vision", fr: "Vision Nocturne" },
      };

      function openInspectorModal(kind, id) {
        const modal = document.getElementById("wikiModal");
        const body = document.getElementById("modalBody");
        const lang = W.getLang();

        if (kind === "entity") {
          const ent = (JS.entities || []).find((e) => e.id === id);
          if (!ent) return;
          const title = W.t(ent.name);
          body.innerHTML = `
            <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;">
              <div style="width:260px;max-width:100%;height:160px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center, rgba(240,173,40,0.16) 0%, var(--bg-input) 78%);border:2px solid var(--border-dark);border-radius:6px;padding:10px;">
                <img src="${ent.render3d}" alt="${W.escapeHtml(title)}" style="max-width:100%;max-height:100%;image-rendering:pixelated;" />
              </div>
              <div style="flex:1;min-width:min(100%,220px);">
                <div class="chapter-kicker">${W.escapeHtml(ent.category)}</div>
                <h2 style="margin:0 0 8px;font-family:'MinecraftTen',sans-serif;color:var(--accent-bright);">${W.escapeHtml(title)}</h2>
                <div style="margin-bottom:8px;"><span class="badge badge-gold">Entity: <code>jobskills:forge_bar</code></span></div>
                <p style="margin:8px 0 0;font-size:13px;color:var(--text-secondary);">${W.escapeHtml(W.t(ent.desc))}</p>
              </div>
            </div>
          `;
          modal.classList.add("open");
          return;
        }

        const it = (JS.items || []).find((x) => x.id === id || x.shortId === id);
        if (!it) return;
        const title = W.t(it.name);
        const recipes = it.recipes || [];
        let recipeHtml = "";
        if (recipes.length > 0) {
          recipeHtml = `
            <h3 style="margin-top:16px;">${lang === "fr" ? "Recette de Fabrication" : "Crafting Recipe"}</h3>
            <div style="display:flex;flex-wrap:wrap;gap:10px;">
              ${recipes.map((r) => W.renderRecipeHtml(r, JS, "")).join("")}
            </div>
          `;
        } else {
          recipeHtml = `<p style="margin-top:14px;color:var(--text-muted);font-size:12.5px;">${lang === "fr"
            ? "Obtenu via atelier du Forgeron (Chaudron / Fourneau / Haut Fourneau / Enclume) en mode Sneak+Clic."
            : "Produced through Blacksmith workstations (Cauldron / Furnace / Blast Furnace / Anvil) using Sneak+Click."
            }</p>`;
        }
        body.innerHTML = `
          <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;">
            <div style="width:140px;height:140px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center, rgba(240,173,40,0.16) 0%, var(--bg-input) 78%);border:2px solid var(--border-dark);border-radius:6px;">
              <img src="${it.icon}" alt="${W.escapeHtml(title)}" style="width:76px;height:76px;image-rendering:pixelated;" />
            </div>
            <div style="flex:1;min-width:min(100%,220px);">
              <div class="chapter-kicker">${W.escapeHtml(it.category)}</div>
              <h2 style="margin:0 0 8px;font-family:'MinecraftTen',sans-serif;color:var(--accent-bright);">${W.escapeHtml(title)}</h2>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
                <span class="badge badge-gold">ID: <code>${W.escapeHtml(it.id)}</code></span>
                <span class="badge">Stack: ${it.maxStack}</span>
              </div>
              <p style="margin:6px 0 0;font-size:13px;color:var(--text-secondary);">${W.escapeHtml(W.t(it.desc))}</p>
            </div>
          </div>
          ${recipeHtml}
        `;
        modal.classList.add("open");
      }

      function renderSidebar() {
        const sb = document.getElementById("wikiSidebar");
        const lang = W.getLang();
        let html = "";

        for (const grp of NAV_GROUPS) {
          const mods = MODULES.filter((m) => m.groupId === grp.id);
          html += `<div class="sidebar-group"><div class="sidebar-group-title">${W.escapeHtml(W.t(grp.label))}</div>`;
          for (const m of mods) {
            const job = m.jobId ? jobById[m.jobId] : null;
            const label = job ? `${W.t(job.name)} (${job.skillCount})` : W.t(m.title);
            const iconHtml = job ? `<img src="${job.icon}" alt="" style="width:18px;height:18px;image-rendering:pixelated;margin-right:6px;vertical-align:middle;" />` : "";
            html += `<button class="nav-item ${currentPageId === m.id ? "active" : ""}" data-page="${m.id}" style="display:flex;align-items:center;">${iconHtml}<span>${W.escapeHtml(label)}</span></button>`;
          }
          html += `</div>`;
        }

        html += `<div class="sidebar-group"><div class="sidebar-group-title">${lang === "fr" ? "Encyclopedies & Outils" : "Encyclopedias & Tools"}</div>`;
        for (const enc of ENCYCLOPEDIAS) {
          html += `
            <button class="nav-item ${currentPageId === enc.id ? "active" : ""}" data-page="${enc.id}">
              <span>${W.escapeHtml(W.t(enc.label))}</span>
              <span class="nav-count">${enc.count}</span>
            </button>
          `;
        }
        html += `</div>`;

        sb.innerHTML = html;
        sb.querySelectorAll(".nav-item[data-page]").forEach((btn) => {
          btn.addEventListener("click", () => navigateTo(btn.getAttribute("data-page")));
        });
      }

      const SKILL_TIER_COSTS = { 8: 2, 6: 4, 4: 8, 2: 14, 0: 22 };
      function getNodeXpCost(y) { return SKILL_TIER_COSTS[y] ?? 2; }
      function getNodeTier(y) { return Math.max(1, Math.min(5, Math.floor((8 - y) / 2) + 1)); }
      function getJobTotalXp(job) {
        if (typeof job.totalXpLevels === "number") return job.totalXpLevels;
        return (job.skills || []).reduce((s, sk) => s + getNodeXpCost(sk.y), 0);
      }

      function renderRoleHeroHtml(jobId) {
        const job = jobById[jobId];
        if (!job) return "";
        const lang = W.getLang();
        const wsList = (job.workstations || []).map((id) => WORKSTATION_NAMES[id] ? W.t(WORKSTATION_NAMES[id]) : id).join(", ") || (lang === "fr" ? "Aucun (Monde / Outils)" : "None (World / Tools)");
        const activeStr = job.activeAbility
          ? `${W.t(job.activeAbility.name)} (1 XP)`
          : (lang === "fr" ? "100% Passif / Sneak" : "100% Passive / Sneak");

        return `
          <div class="role-hero-box">
            <div class="role-stat-tile">
              <img src="${job.icon}" alt="${W.escapeHtml(W.t(job.name))}" />
              <div>
                <span class="role-stat-lbl">${lang === "fr" ? "Metier" : "Profession"}</span>
                <span class="role-stat-val">${W.escapeHtml(W.t(job.name))}</span>
              </div>
            </div>
            <div class="role-stat-tile">
              <img src="assets/items/skill_book.png" alt="Skills" />
              <div>
                <span class="role-stat-lbl">${lang === "fr" ? "Arbre de Talents" : "Skill Tree"}</span>
                <span class="role-stat-val">${job.skillCount} ${lang === "fr" ? "Noeuds" : "Nodes"} (${getJobTotalXp(job)} ${lang === "fr" ? "Niv. XP max" : "XP Lvls max"})</span>
              </div>
            </div>
            <div class="role-stat-tile">
              <img src="${job.workstations?.length ? `../assets/vanilla/${job.workstations[0].replace("minecraft:", "")}.png` : job.icon}" alt="Workstations" />
              <div>
                <span class="role-stat-lbl">${lang === "fr" ? "Etablis Clefs" : "Workstations"}</span>
                <span class="role-stat-val" style="font-size:12.5px;">${W.escapeHtml(wsList)}</span>
              </div>
            </div>
            <div class="role-stat-tile">
              <img src="../assets/vanilla/experience_bottle.png" alt="Active" />
              <div>
                <span class="role-stat-lbl">${lang === "fr" ? "Pouvoir Actif" : "Active Ability"}</span>
                <span class="role-stat-val" style="font-size:12.5px;">${W.escapeHtml(activeStr)}</span>
              </div>
            </div>
          </div>
          <div style="margin-bottom:14px;">
            <button class="oreui-btn oreui-btn-sm oreui-btn-gold js-open-tree-btn" data-job="${job.id}" type="button">
              ${lang === "fr" ? `Explorer l'Arbre 13x9 (${job.skillCount} Competences)` : `Explore 13x9 Skill Tree (${job.skillCount} Skills)`}
            </button>
          </div>
        `;
      }

      function renderPipelineHtml(steps) {
        const parts = [];
        steps.forEach((st, idx) => {
          if (idx > 0) parts.push(`<div class="workflow-arrow">&#10142;</div>`);
          const iconsHtml = (st.icons || []).map((src) => `<img src="${src}" alt="" />`).join("");
          parts.push(`
            <div class="workflow-step">
              <div class="workflow-step-head">
                <span class="workflow-step-num">${st.step}</span>
                <div class="workflow-step-title">${W.escapeHtml(W.t(st.title))}</div>
              </div>
              <div class="workflow-step-icons">${iconsHtml}</div>
              ${st.badge ? `<span class="badge badge-gold">${W.escapeHtml(W.t(st.badge))}</span>` : ""}
              <p>${W.t(st.desc)}</p>
            </div>
          `);
        });
        return `<div class="workflow-pipeline">${parts.join("")}</div>`;
      }

      function renderJobsOverviewCardsHtml() {
        const lang = W.getLang();
        return `
          <div class="role-overview-grid">
            ${(JS.jobs || []).map((j) => `
              <div class="role-mini-card" data-jump-page="${j.chapterId}">
                <div class="role-mini-head">
                  <img src="${j.icon}" alt="${W.escapeHtml(W.t(j.name))}" />
                  <div>
                    <div class="role-mini-title">${W.escapeHtml(W.t(j.name))}</div>
                    <div class="role-mini-sub">${j.skillCount} ${lang === "fr" ? "competences" : "skills"} • ${getJobTotalXp(j)} ${lang === "fr" ? "Niv. XP" : "XP Lvls"} • ${j.connectorCount} ${lang === "fr" ? "liens" : "links"}</div>
                  </div>
                </div>
                <p style="margin:0;font-size:12.5px;color:var(--text-secondary);">${W.escapeHtml(W.t(j.subtitle))}</p>
                <div style="margin-top:auto;padding-top:4px;font-size:11.5px;color:var(--accent-bright);">
                  ${lang === "fr" ? "Ouvrir la presentation ->" : "Open role guide ->"}
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      function renderForgeSimulatorHtml(container) {
        const lang = W.getLang();
        const total = Math.round(0.35 * state.simHeat + 0.65 * state.simStrike);
        let rawRating = 1;
        if (total >= 94) rawRating = 5;
        else if (total >= 80) rawRating = 4;
        else if (total >= 64) rawRating = 3;
        else if (total >= 45) rawRating = 2;
        const rating = state.simMasterSeal ? rawRating : Math.min(4, rawRating);
        const th = JS.forgeStats.thresholds.find((t) => t.rating === rating) || JS.forgeStats.thresholds[0];
        const pool = JS.forgeStats.pools[state.simCat] || [];
        const defs = JS.forgeStats.defs || {};
        const idx = rating - 1;
        const statCount = rating <= 2 ? 1 : rating <= 4 ? 2 : 3;

        function formatStatLine(id) {
          const d = defs[id];
          if (!d) return id;
          const v = d.vals[idx] || 0;
          const l = d.lvls[idx] || 0;
          const lbl = W.t(STAT_LABELS[id] || { en: id, fr: id });
          if (id === "lifesteal") return `${lbl}: +${v} HP / kill`;
          if (v > 0 && l > 0) return `${lbl}: ${v}% + Tier ${l}`;
          if (v > 0) return `${lbl}: ${id.includes("defense") || id === "feather" || id === "fireproof" ? "-" : "+"}${v}%`;
          if (l > 0) return `${lbl}: Level ${l}`;
          return lbl;
        }

        const eligibleStats = pool.filter((id) => (defs[id]?.minRating || 1) <= rating);
        const barsStr = "|".repeat(rating) + ".".repeat(5 - rating);

        container.innerHTML = `
          <div class="forge-sim-box">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">
              <strong style="color:var(--accent-bright);font-family:'MinecraftTen',sans-serif;font-size:17px;">
                ${lang === "fr" ? "SIMULATEUR DE QUALITE & STATS DE FORGE" : "FORGE QUALITY & STAT ROLL SIMULATOR"}
              </strong>
              <span class="badge badge-gold">Total = round(0.35 * ${state.simHeat} + 0.65 * ${state.simStrike}) = <strong>${total}/100</strong></span>
            </div>

            <div class="tax-inputs-grid">
              <div class="tax-field">
                <label>${lang === "fr" ? "Categorie Equipement" : "Equipment Category"}</label>
                <select class="ore-select" id="simCatSel">
                  <option value="weapon" ${state.simCat === "weapon" ? "selected" : ""}>${lang === "fr" ? "Arme Melee (Epee / Masse / Lance)" : "Weapon (Sword / Mace / Spear)"}</option>
                  <option value="axe" ${state.simCat === "axe" ? "selected" : ""}>${lang === "fr" ? "Hache / Poleaxe / Bardiche" : "Axe / Poleaxe / Bardiche"}</option>
                  <option value="armor_heavy" ${state.simCat === "armor_heavy" ? "selected" : ""}>${lang === "fr" ? "Armure Lourde (Casque / Plastron)" : "Heavy Armor (Helmet / Chest)"}</option>
                  <option value="armor_agile" ${state.simCat === "armor_agile" ? "selected" : ""}>${lang === "fr" ? "Armure Agile (Jambieres / Bottes)" : "Agile Armor (Legs / Boots)"}</option>
                  <option value="tool" ${state.simCat === "tool" ? "selected" : ""}>${lang === "fr" ? "Outils (Pioche / Pelle / Houe)" : "Tool (Pick / Shovel / Hoe)"}</option>
                </select>
              </div>
              <div class="tax-field">
                <label>${lang === "fr" ? `Chauffe Fourneau (35%): ${state.simHeat}` : `Furnace Heat (35%): ${state.simHeat}`}</label>
                <input type="range" min="15" max="100" value="${state.simHeat}" id="simHeatRange" style="width:100%;" />
              </div>
              <div class="tax-field">
                <label>${lang === "fr" ? `Frappe Enclume (65%): ${state.simStrike}` : `Anvil Strike (65%): ${state.simStrike}`}</label>
                <input type="range" min="15" max="100" value="${state.simStrike}" id="simStrikeRange" style="width:100%;" />
              </div>
              <div class="tax-field">
                <label>${lang === "fr" ? "Sceau de Maitre ([5/5])" : "Master Seal Unlocked"}</label>
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-main);text-transform:none;">
                  <input type="checkbox" id="simMasterChk" ${state.simMasterSeal ? "checked" : ""} />
                  <span>${state.simMasterSeal ? (lang === "fr" ? "Oui (Cap [5/5])" : "Yes (Cap [5/5])") : (lang === "fr" ? "Non (Cap [4/5])" : "No (Cap [4/5])")}</span>
                </label>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;align-items:start;">
              <div class="mc-lore-box">
                <div class="mc-line-muted">--- [Forge] ---</div>
                <div style="color:${th.hex};font-weight:700;">Quality: [${rating}/5] ${barsStr} (${lang === "fr" ? th.fr : th.en})</div>
                <div class="mc-line-muted">Forged by: <span style="color:#fff;">ArtisanBlacksmith</span></div>
                ${eligibleStats.map((id, i) => `<div style="color:${i === 0 ? "#ffd978" : "#87e8de"};">${i === 0 ? "[Guaranteed]" : "[Pool]"} ${W.escapeHtml(formatStatLine(id))}</div>`).join("")}
                <div class="mc-line-muted">---------------</div>
              </div>
              <div class="oreui-card" style="padding:12px;">
                <div style="font-family:'MinecraftTen',sans-serif;font-size:15px;color:${th.hex};margin-bottom:6px;">
                  ${lang === "fr" ? `Tirage : ${statCount} statistique(s) sur ${eligibleStats.length} eligibles` : `Roll Result: ${statCount} stat(s) from ${eligibleStats.length} eligible`}
                </div>
                <p style="margin:0;font-size:12.5px;color:var(--text-secondary);">
                  ${lang === "fr"
            ? "La 1re stat de la categorie est TOUJOURS garantie. Les suivantes sont tirees sans doublon parmi les stats dont le rang min est atteint."

        }

        const prereqSet = new Set(selected?.requires || []);
        const childSet = new Set(selected?.unlocks || []);
        const skillByCoord = new Map(skills.map((s) => [`${s.x},${s.y}`, s]));
        const connByCoord = new Map((job.connectors || []).map((c) => [`${c.x},${c.y}`, c]));
        const q = state.treeSearch.trim().toLowerCase();

        let cellsHtml = "";

          for (let x = 0; x < 13; x++) {
            const key = `${x},${y}`;

              if (conn.u) inner += `<span class="dag-arm dag-arm-u"></span>`;
              if (conn.d) inner += `<span class="dag-arm dag-arm-d"></span>`;
              if (conn.l) inner += `<span class="dag-arm dag-arm-l"></span>`;

            }
            if (sk) {
              const nm = W.t(sk.name).toLowerCase();
              const ds = W.t(sk.desc).toLowerCase();
              const dimmed = q && !nm.includes(q) && !ds.includes(q) && !sk.id.toLowerCase().includes(q);
              const cls = [
                "dag-node",
                sk.fr === "goal" ? "dag-goal" : "",
                sk.id === selected?.id ? "is-selected" : "",

            <h1>${lang === "fr" ? "Laboratoire des Buffs Artisanaux [1/5]–[5/5]" : "Artisan Consumables & Buffs Simulator [1/5]–[5/5]"}</h1>
            <p>${lang === "fr" ? "Visualisez exactement les effets et la duree des items produits par les Eleveurs, Fermiers, Pecheurs, Chasseurs et Chevaliers." : "Preview exact tooltips, durations, and amplifier scaling for shareable buffs crafted by Ranchers, Farmers, Fishers, Hunters, and Knights."}</p>
          </div>

          <div class="forge-sim-box">
            <div class="tax-inputs-grid">
              <div class="tax-field">
                <label>${lang === "fr" ? "Metier Producteur" : "Crafting Profession"}</label>
                <select class="ore-select" id="consJobSel">
                  <option value="farmer" ${state.consJob === "farmer" ? "selected" : ""}>${lang === "fr" ? "Fermier (Fumoir 3D)" : "Farmer (3D Smoker)"}</option>
                  <option value="fisher" ${state.consJob === "fisher" ? "selected" : ""}>${lang === "fr" ? "Pecheur (Tonneau 3D)" : "Fisher (3D Barrel)"}</option>
                  <option value="hunter" ${state.consJob === "hunter" ? "selected" : ""}>${lang === "fr" ? "Chasseur (Archerie 3D)" : "Hunter (3D Fletching)"}</option>
                  <option value="knight" ${state.consJob === "knight" ? "selected" : ""}>${lang === "fr" ? "Chevalier (Meule 3D)" : "Knight (3D Grindstone)"}</option>
                  <option value="rancher" ${state.consJob === "rancher" ? "selected" : ""}>${lang === "fr" ? "Eleveur (Lait / Ruche)" : "Rancher (Milk / Honey)"}</option>
                </select>
              </div>
              <div class="tax-field">
                <label>${lang === "fr" ? "Produit / Categorie" : "Product / Category"}</label>
                <select class="ore-select" id="consCatSel">
                  ${cats.map((c) => `<option value="${c.id}" ${c.id === state.consCategory ? "selected" : ""}>${W.escapeHtml(W.t(c.label))}</option>`).join("")}
                </select>
              </div>
              ${state.consJob !== "rancher" ? `
                <div class="tax-field">
                  <label>${lang === "fr" ? `Qualite Obtenue : [${r}/5]` : `Rolled Quality: [${r}/5]`}</label>
                  <input type="range" min="1" max="5" value="${r}" id="consRatingRange" style="width:100%;" />
                </div>
              ` : ""}
            </div>

            <div class="mc-lore-box">
              ${loreLines.map((ln, idx) => {
          if (idx === 0 || idx === loreLines.length - 1 || ln.startsWith("Cooked by") || ln.startsWith("Crafted by") || ln.startsWith("Cured by") || ln.startsWith("Forged by") || ln.startsWith("Harvested by")) {
            return `<div class="mc-line-muted">${W.escapeHtml(ln)}</div>`;
          }
          if (ln.startsWith("Quality:")) return `<div style="color:${colors[r]};font-weight:700;">${W.escapeHtml(ln)}</div>`;
          if (idx === 1) return `<div class="mc-line-title">${W.escapeHtml(ln)}</div>`;
          return `<div style="color:#87e8de;">${W.escapeHtml(ln)}</div>`;
        }).join("")}
            </div>
          </div>
          ${renderChapterNavFooter()}
        `;

        main.querySelector("#consJobSel").addEventListener("change", (e) => { state.consJob = e.target.value; renderConsumablesLab(main); });
        main.querySelector("#consCatSel").addEventListener("change", (e) => { state.consCategory = e.target.value; renderConsumablesLab(main); });
        const rr = main.querySelector("#consRatingRange");
        if (rr) rr.addEventListener("input", (e) => { state.consRating = Number(e.target.value); renderConsumablesLab(main); });
        bindFooterNav(main);
      }

      function bindInspectors(scope) {
        scope.querySelectorAll("[data-inspect-kind]").forEach((el) => {
          el.addEventListener("click", () => {
            openInspectorModal(el.getAttribute("data-inspect-kind"), el.getAttribute("data-inspect-id"));
          });
        });
      }

      function bindFooterNav(scope) {
        scope.querySelectorAll("[data-nav-page]").forEach((b) => {
          b.addEventListener("click", () => navigateTo(b.getAttribute("data-nav-page")));
        });
      }

      function renderCurrentPage() {
        renderSidebar();
        const main = document.getElementById("wikiMain");

        if (currentPageId === "enc-trees") return renderSkillTreesEncyclopedia(main);
        if (currentPageId === "enc-items") return renderItemsEncyclopedia(main);
        if (currentPageId === "enc-consumables") return renderConsumablesLab(main);

        const mod = MODULES.find((m) => m.id === currentPageId) || MODULES[0];
        if (!mod) return;

        main.innerHTML = `
          <div class="oreui-panel chapter-header">
            <span class="chapter-kicker">${W.escapeHtml(W.t(mod.kicker))}</span>
            <h1>${W.escapeHtml(W.t(mod.title))}</h1>
            <p>${W.escapeHtml(W.t(mod.subtitle))}</p>
          </div>
          ${mod.sections.map((s) => renderSectionHtml(s)).join("")}
          ${renderChapterNavFooter()}
        `;

        main.querySelectorAll(".js-forge-sim-mount").forEach((m) => renderForgeSimulatorHtml(m));
        main.querySelectorAll("[data-jump-page]").forEach((c) => {
          c.addEventListener("click", () => navigateTo(c.getAttribute("data-jump-page")));
        });
        main.querySelectorAll(".js-open-tree-btn").forEach((b) => {
          b.addEventListener("click", () => {
            state.activeTreeJob = b.getAttribute("data-job");
            state.selectedSkillId = null;
            navigateTo("enc-trees");
          });
        });
        bindInspectors(main);
        bindFooterNav(main);
      }

      function navigateTo(pageId, skillId) {
        if (!PAGE_ORDER.includes(pageId)) return;
        currentPageId = pageId;
        if (skillId) state.selectedSkillId = skillId;
        location.hash = pageId;
        document.getElementById("wikiSidebar")?.classList.remove("open");
        renderCurrentPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function buildSearchIndex() {
        const docs = [];
        for (const m of MODULES) {
          docs.push({
            cat: { en: "Chapter", fr: "Chapitre" },
            title: m.title,
            desc: m.subtitle,
            hay: `${m.id} ${m.title.en} ${m.title.fr} ${m.subtitle.en} ${m.subtitle.fr}`.toLowerCase(),
            go: () => navigateTo(m.id),
          });
        }
        for (const j of JS.jobs || []) {
          for (const sk of j.skills || []) {
            docs.push({
              cat: { en: `Skill • ${j.name.en}`, fr: `Competence • ${j.name.fr}` },
              title: sk.name,
              desc: sk.desc,
              hay: `${j.id} ${j.name.en} ${j.name.fr} ${sk.id} ${sk.name.en} ${sk.name.fr} ${sk.desc.en} ${sk.desc.fr}`.toLowerCase(),
              go: () => {
                state.activeTreeJob = j.id;
                state.selectedSkillId = sk.id;
                navigateTo("enc-trees", sk.id);
              },
            });
          }
        }
        for (const it of JS.items || []) {
          docs.push({
            cat: { en: "Item", fr: "Objet" },
            title: it.name,
            desc: it.desc,
            hay: `${it.id} ${it.name.en} ${it.name.fr} ${it.desc.en} ${it.desc.fr}`.toLowerCase(),
            go: () => {
              navigateTo("enc-items");
              setTimeout(() => openInspectorModal("item", it.id), 120);
            },
          });
        }
        return docs;
      }

      function initSearch() {
        const input = document.getElementById("globalSearch");
        const dd = document.getElementById("searchDropdown");
        const docs = buildSearchIndex();

        input.addEventListener("input", () => {
          const q = input.value.trim().toLowerCase();
          if (!q) {
            dd.classList.remove("open");
            dd.innerHTML = "";
            return;
          }
          const hits = docs.filter((d) => d.hay.includes(q)).slice(0, 14);
          if (hits.length === 0) {
            dd.innerHTML = `<div class="search-hit"><div class="search-hit-desc">${W.getLang() === "fr" ? "Aucun resultat." : "No matching results."}</div></div>`;
          } else {
            dd.innerHTML = hits.map((h, i) => `
              <div class="search-hit" data-hit-idx="${i}">
                <span class="search-hit-cat">${W.escapeHtml(W.t(h.cat))}</span>
                <span class="search-hit-title">${W.escapeHtml(W.t(h.title))}</span>
                <span class="search-hit-desc">${W.escapeHtml(W.t(h.desc).slice(0, 110))}</span>
              </div>
            `).join("");
            dd.querySelectorAll(".search-hit[data-hit-idx]").forEach((row) => {
              row.addEventListener("click", () => {
                const idx = Number(row.getAttribute("data-hit-idx"));
                dd.classList.remove("open");
                hits[idx]?.go();
              });
            });
          }
          dd.classList.add("open");
        });

        document.addEventListener("click", (e) => {
          if (!e.target.closest(".topbar-search")) dd.classList.remove("open");
        });
        document.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            input.focus();
          }
        });
      }

      document.getElementById("btnMobileMenu")?.addEventListener("click", () => {
        document.getElementById("wikiSidebar")?.classList.toggle("open");
      });
      document.getElementById("btnCloseModal")?.addEventListener("click", () => {
        document.getElementById("wikiModal")?.classList.remove("open");
      });
      document.getElementById("wikiModal")?.addEventListener("click", (e) => {
        if (e.target.id === "wikiModal") e.currentTarget.classList.remove("open");
      });
      window.addEventListener("hashchange", () => {
        const next = (location.hash || "").replace(/^#/, "");
        if (PAGE_ORDER.includes(next) && next !== currentPageId) {
          currentPageId = next;
          renderCurrentPage();
        }
      });
      window.addEventListener("frontier:langchange", renderCurrentPage);

      W.initThemeAndLangControls();
      initSearch();
      renderCurrentPage();
    })();
  </script>
</body>

</html>
